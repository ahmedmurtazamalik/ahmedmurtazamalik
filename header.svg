<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" width="900" height="300">
  <defs>
    <style>
      .cover-bg { fill: #141412; }
      .cover-border { fill: none; stroke: #4a4740; stroke-width: 0.75; }
      .cover-monogram { font-family: 'Courier New', Courier, monospace; font-size: 72px; font-weight: 700; fill: #e8e4dc; letter-spacing: 6px; }
      .cover-sub { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #6b6760; letter-spacing: 3px; }
      .cover-rule { stroke: #4a4740; stroke-width: 0.75; }
      .cover-corner { font-family: 'Courier New', Courier, monospace; font-size: 8px; fill: #3a3835; letter-spacing: 1px; }
      .name { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 400; fill: #e8e4dc; letter-spacing: 1px; }
      .role { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #6b6760; letter-spacing: 2.5px; }
      .rule-line { stroke: #2e2d2b; stroke-width: 0.75; }
      .oneliner { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: #a8a49c; }
      .contact-label { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #4a4740; letter-spacing: 2px; }
      .contact-val { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #7a7570; letter-spacing: 1px; }
      .bg-main { fill: #0e0e0c; }
      .page-num { font-family: 'Courier New', Courier, monospace; font-size: 8px; fill: #2a2925; letter-spacing: 1px; }
      .bracket { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #2e2d2b; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- main background -->
  <rect width="900" height="300" class="bg-main"/>

  <!-- subtle grain texture via pattern -->
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.4" fill="#ffffff" opacity="0.015"/>
      <circle cx="3" cy="3" r="0.4" fill="#ffffff" opacity="0.01"/>
    </pattern>
  </defs>
  <rect width="900" height="300" fill="url(#grain)"/>

  <!-- left edge rule -->
  <line x1="48" y1="28" x2="48" y2="272" class="rule-line"/>

  <!-- cover square -->
  <rect x="68" y="44" width="192" height="212" class="cover-bg"/>
  <rect x="68" y="44" width="192" height="212" class="cover-border"/>

  <!-- cover inner frame -->
  <rect x="78" y="54" width="172" height="192" fill="none" stroke="#1e1e1c" stroke-width="0.5"/>

  <!-- large monogram -->
  <text x="164" y="148" class="cover-monogram" text-anchor="middle" dominant-baseline="middle">AMM</text>

  <!-- rule under monogram -->
  <line x1="96" y1="175" x2="232" y2="175" class="cover-rule"/>

  <!-- sub text below rule -->
  <text x="164" y="194" class="cover-sub" text-anchor="middle">ISLAMABAD · 2026</text>

  <!-- corner notations -->
  <text x="82" y="67" class="cover-corner">SIDE A</text>
  <text x="82" y="245" class="cover-corner">CS-001</text>
  <text x="222" y="245" class="cover-corner" text-anchor="end">◆</text>

  <!-- right panel starts at x=300 -->
  <!-- name -->
  <text x="300" y="96" class="name">Ahmed Murtaza Malik</text>

  <!-- role line -->
  <text x="302" y="118" class="role">COMPUTER SCIENCE  ·  FAST NUCES  ·  ISLAMABAD</text>

  <!-- horizontal rule -->
  <line x1="300" y1="138" x2="860" y2="138" class="rule-line"/>

  <!-- one liner — two lines -->
  <text x="300" y="164" class="oneliner">CS senior. Deep learning, parallel systems, compilers, game dev.</text>
  <text x="300" y="186" class="oneliner">All projects written with headphones on.</text>

  <!-- second rule -->
  <line x1="300" y1="206" x2="860" y2="206" class="rule-line"/>

  <!-- contact block — three columns -->
  <!-- general -->
  <text x="300" y="224" class="contact-label">GENERAL</text>
  <text x="300" y="237" class="contact-val">ahmedmurtazamalik@gmail.com</text>

  <!-- professional -->
  <text x="520" y="224" class="contact-label">PROFESSIONAL</text>
  <text x="520" y="237" class="contact-val">linkedin · ahmed-murtaza-malik</text>

  <!-- fiction -->
  <text x="720" y="224" class="contact-label">FICTION</text>
  <text x="720" y="237" class="contact-val">@joeywritessometimes</text>

  <!-- third rule -->
  <line x1="300" y1="254" x2="860" y2="254" class="rule-line"/>

  <!-- bottom line — page number style -->
  <text x="300" y="270" class="page-num">GITHUB.COM/AHMEDMURTAZAMALIK</text>
  <text x="860" y="270" class="page-num" text-anchor="end">★ ★ ★ ★</text>

  <!-- right edge rule -->
  <line x1="872" y1="28" x2="872" y2="272" class="rule-line"/>

  <!-- top/bottom rules full width -->
  <line x1="48" y1="28" x2="872" y2="28" class="rule-line"/>
  <line x1="48" y1="272" x2="872" y2="272" class="rule-line"/>

</svg>
